name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Bumps the version, updates CHANGELOG.md and pushes the commit + tag.
  # Building happens afterwards so every artifact embeds the new version.
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install deps
        run: npm ci

      - name: Bump version and tag
        id: bump
        run: |
          npm run release -- --ci --verbose
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify version sync
        run: npm run check:version

  cli-binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build CLI binaries (x64)
        run: npm run build:binaries -- x64
      - uses: actions/upload-artifact@v4
        with:
          name: cli-x64
          path: dist/*
          if-no-files-found: error

  # Apple Silicon binaries must be signed, which pkg only does on a macOS host
  cli-macos-arm64:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build CLI binary (macOS arm64)
        run: npm run build:binaries -- macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          path: dist/ghx-tool-macos-arm64
          if-no-files-found: error

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Signs with real certificates when the secrets below exist; otherwise
      # macOS gets an ad-hoc signature and Windows stays unsigned.
      - name: Build desktop app
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          args=(${{ matrix.target }})
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          case "$RUNNER_OS" in
            macOS)
              if [ -n "$MAC_CSC_LINK" ]; then
                export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
                args+=("-c.mac.identity=$MAC_CSC_NAME" "-c.mac.hardenedRuntime=true")
              else
                echo "::warning::No MAC_CSC_LINK secret: macOS app is ad-hoc signed and not notarized"
                export CSC_IDENTITY_AUTO_DISCOVERY=false
              fi
              ;;
            Windows)
              if [ -n "$WIN_CSC_LINK" ]; then
                export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
              else
                echo "::warning::No WIN_CSC_LINK secret: Windows installer is unsigned"
              fi
              ;;
          esac
          npm run desktop:dist -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error

  release:
    needs: [version, cli-binaries, cli-macos-arm64, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Release notes are this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            /^##? \[?[0-9]+\.[0-9]+\.[0-9]+/ { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release v$VERSION" > notes.md

          cp install/* artifacts/
          # Checksums so downloads can be verified (shasum -a 256 -c SHA256SUMS.txt)
          (cd artifacts && sha256sum * > SHA256SUMS.txt)

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --verify-tag \
            artifacts/*

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
